<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="theme-color" content="#0d85e0" />
  <link rel="icon" type="image/png" href="app-icon.png" />
  <link rel="apple-touch-icon" href="app-icon.png" />
  <link rel="manifest" href="manifest.json" />
  <title>96-Well Infection Mask Recorder</title>
  <style>
    :root {
      color-scheme: light;
      --ink:#111820; --muted:#607080; --blue:#0d85e0; --blue-dark:#07578f;
      --paper:#f4f9fd; --card:#ffffff; --line:#c8d8e5; --infected:#e43a47;
      --suspected:#f3a712; --clear:#25a36f; --masked:#172b4d; --shadow:0 18px 48px rgba(31,70,100,.12);
    }
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;color:var(--ink);font-family:Inter,ui-sans-serif,system-ui,-apple-system,"Segoe UI",sans-serif;background:radial-gradient(circle at 85% 0,rgba(13,133,224,.14),transparent 25rem),linear-gradient(145deg,#f8fbfe,#edf5fb)}
    button,input,textarea{font:inherit} button{cursor:pointer}
    .shell{width:min(1240px,100%);margin:auto;padding:24px 18px 70px}
    header{display:flex;justify-content:space-between;align-items:end;gap:22px;margin-bottom:20px}
    .kicker{margin:0 0 6px;color:var(--blue);font-size:.74rem;font-weight:850;letter-spacing:.14em;text-transform:uppercase}
    h1{margin:0;font:700 clamp(2rem,6vw,4.5rem)/.98 Georgia,"Noto Serif TC",serif;letter-spacing:-.045em}
    header p:last-child{margin:11px 0 0;color:var(--muted);line-height:1.55}
    .local-pill{flex:0 0 auto;padding:8px 12px;border-radius:999px;color:var(--blue-dark);background:#dcefff;font-size:.76rem;font-weight:800}
    .panel{margin-bottom:18px;padding:18px;border:1px solid rgba(13,133,224,.16);border-radius:18px;background:rgba(255,255,255,.94);box-shadow:var(--shadow)}
    .setup{display:grid;grid-template-columns:1fr 1.15fr .9fr .9fr .7fr;gap:12px;align-items:end}
    label{display:grid;gap:6px;font-size:.78rem;font-weight:800}.hint{color:var(--muted);font-size:.7rem;font-weight:500;line-height:1.4}
    input,select,textarea{width:100%;border:1px solid var(--line);border-radius:10px;color:var(--ink);background:white;outline:none}
    input,select{min-height:43px;padding:0 11px} textarea{min-height:68px;padding:10px 11px;resize:vertical}
    input:focus,select:focus,textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px rgba(13,133,224,.14)}
    .day-display{min-height:43px;display:flex;align-items:center;padding:0 12px;border-radius:10px;color:var(--blue-dark);background:#e8f4fd;font-weight:850}
    .toolbar{display:flex;flex-wrap:wrap;justify-content:space-between;align-items:center;gap:12px;margin-top:15px}
    .brushes,.actions{display:flex;flex-wrap:wrap;gap:8px}
    .brush,.btn{min-height:40px;border:0;border-radius:10px;padding:0 14px;font-weight:800}
    .brush{color:var(--ink);background:#edf2f5}.brush::before{content:"";display:inline-block;width:10px;height:10px;margin-right:7px;border-radius:50%;background:var(--brush)}
    .brush.active{box-shadow:0 0 0 3px var(--brush);background:white}
    .btn{color:white;background:var(--blue)}.btn:hover{background:var(--blue-dark)}
    .btn.secondary{color:var(--blue-dark);background:#dcefff}.btn.danger{color:#9a2330;background:#fae3e6}
    .plate-panel{padding:18px;overflow:hidden}
    .plate-head{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-bottom:13px}
    .plate-head h2{margin:0;font-size:1rem}.count-summary{color:var(--muted);font-size:.76rem;font-weight:750}
    .plate-scroll{overflow-x:auto;padding:4px 2px 12px}
    .plate{min-width:820px;display:grid;grid-template-columns:30px repeat(12,minmax(48px,1fr));gap:7px;align-items:center;padding:18px;border:2px solid #b9c9d5;border-radius:28px;background:#eef4f7;box-shadow:inset 0 0 0 7px white}
    .col-label,.row-label{display:grid;place-items:center;color:var(--muted);font:800 .72rem/1 ui-monospace,SFMono-Regular,Consolas,monospace}
    .well{position:relative;aspect-ratio:1;border:2px solid #9badba;border-radius:50%;color:#40515e;background:radial-gradient(circle at 35% 30%,#fff 0 13%,#dfe8ed 15% 55%,#c2d0d8 58% 100%);box-shadow:inset 0 0 0 3px rgba(255,255,255,.7),0 2px 3px rgba(40,60,74,.13);font:800 .66rem/1 ui-monospace,SFMono-Regular,Consolas,monospace}
    .well:hover{transform:translateY(-1px);border-color:var(--blue)}.well:focus-visible{outline:3px solid var(--blue);outline-offset:2px}
    .well.infected{border-color:#a71827;color:white;background:radial-gradient(circle at 35% 30%,#ff9ca6 0 12%,var(--infected) 15% 62%,#a71827 65% 100%)}
    .well.suspected{border-color:#ad7100;color:#332000;background:radial-gradient(circle at 35% 30%,#ffe7a8 0 12%,var(--suspected) 15% 62%,#c88605 65% 100%)}
    .well.clear{border-color:#19734e;color:white;background:radial-gradient(circle at 35% 30%,#a9e3cd 0 12%,var(--clear) 15% 62%,#19734e 65% 100%)}
    .well.prior-masked:not(.infected):not(.suspected):not(.clear){border-color:var(--masked);color:white;background:repeating-linear-gradient(135deg,#172b4d 0 7px,#29436e 7px 14px)}
    .well.prior-masked::after{content:"M";position:absolute;right:-3px;bottom:-3px;display:grid;place-items:center;width:16px;height:16px;border:2px solid white;border-radius:50%;color:white;background:var(--masked);font-size:.55rem}
    .legend{display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;color:var(--muted);font-size:.72rem}.legend span::before{content:"";display:inline-block;width:10px;height:10px;margin-right:5px;border-radius:50%;background:var(--legend)}
    .well-inspector{display:grid;grid-template-columns:220px 1fr;gap:15px;margin-top:15px;padding:14px;border:1px solid var(--line);border-radius:14px;background:#f8fbfd}.well-inspector[hidden]{display:none}.well-inspector h3{margin:0 0 9px;font-size:.9rem}.well-photo{position:relative;display:grid;place-items:center;min-height:155px;overflow:hidden;border:1px dashed #8fb3ca;border-radius:11px;color:var(--blue-dark);background:#eef7fd;text-align:center}.well-photo img{display:none;width:100%;height:180px;object-fit:cover}.well-photo.has-photo img{display:block}.well-photo.has-photo .photo-prompt{display:none}.photo-prompt{padding:15px;font-size:.75rem;font-weight:800;line-height:1.5}.photo-prompt b{display:block;font-size:1.4rem}.photo-buttons{display:flex;gap:8px;margin-top:8px}.photo-buttons button{flex:1;min-height:35px;border:0;border-radius:9px;color:var(--blue-dark);background:#dcefff;font-size:.72rem;font-weight:800}.photo-buttons .remove{color:#9a2330;background:#fae3e6}.well-meta textarea{min-height:105px}
    .notes{display:grid;grid-template-columns:1fr auto;gap:12px;align-items:end;margin-top:15px}.notes .btn{min-width:150px}
    .table-wrap{overflow-x:auto}.history{width:100%;border-collapse:collapse;font-size:.77rem}.history th,.history td{padding:9px 10px;border-bottom:1px solid #e2e9ee;text-align:left;white-space:nowrap}.history th{color:var(--muted);font-size:.67rem;text-transform:uppercase;letter-spacing:.06em}.history button{border:0;border-radius:7px;padding:5px 8px;color:#9a2330;background:#fae3e6;font-weight:800}
    .empty{padding:25px;color:var(--muted);text-align:center}
    footer{margin-top:22px;color:var(--muted);font-size:.72rem;line-height:1.6}
    @media(max-width:820px){header{display:block}.local-pill{display:inline-block;margin-top:12px}.setup{grid-template-columns:1fr 1fr}.notes{grid-template-columns:1fr}.notes .btn{width:100%}.well-inspector{grid-template-columns:1fr}.well-photo{min-height:130px}}
    @media(max-width:520px){.shell{padding:16px 10px 55px}.setup{grid-template-columns:1fr}.panel{padding:13px}.plate-panel{padding:12px}.plate{min-width:760px}.brush,.btn{flex:1}.toolbar{align-items:stretch}}
  </style>
</head>
<body>
  <div class="shell">
    <header>
      <div><p class="kicker">Microscopy QC</p><h1>96-Well Mask</h1><p>按日期記錄感染 well，自動保留第一次確認感染日，供後續資料分析開始 mask。</p></div>
      <div class="local-pill" id="saveStatus">資料儲存在此裝置</div>
    </header>

    <section class="panel">
      <div class="setup">
        <label>已儲存 Plate<select id="plateSelect"><option value="">選擇盤子…</option></select><span class="hint">直接選擇以前輸入過的名稱。</span></label>
        <label>新增／目前 Plate ID<input id="plateId" placeholder="例如 E3-AV1-PM2A-2" autocomplete="off" /><span class="hint">新盤子輸入一次，儲存後會加入選單。</span></label>
        <label>實驗開始日（D0）<input id="startDate" type="date" /><span class="hint">用來自動換算 D0、D1…</span></label>
        <label>觀察日期<input id="observationDate" type="date" /><span class="hint">感染被觀察／確認的日期。</span></label>
        <label>Time point<div class="day-display" id="dayDisplay">—</div><span class="hint">依 D0 自動計算。</span></label>
      </div>
      <div class="toolbar">
        <div class="brushes" role="group" aria-label="選擇標記狀態">
          <button class="brush active" type="button" data-status="infected" style="--brush:var(--infected)">確認感染</button>
          <button class="brush" type="button" data-status="suspected" style="--brush:var(--suspected)">疑似感染</button>
          <button class="brush" type="button" data-status="clear" style="--brush:var(--clear)">確認正常</button>
          <button class="brush" type="button" data-status="none" style="--brush:#9badba">取消標記</button>
        </div>
        <div class="actions"><button class="btn secondary" id="loadRecord" type="button">載入日期紀錄</button><button class="btn secondary" id="hidePlate" type="button">從選單隱藏</button><button class="btn secondary" id="restoreHidden" type="button">顯示隱藏盤子</button><button class="btn danger" id="deletePlate" type="button">刪除這個盤子</button><button class="btn secondary" id="clearDraft" type="button">清除本日標記</button></div>
      </div>
    </section>

    <section class="panel plate-panel">
      <div class="plate-head"><h2 id="plateTitle">96-well plate</h2><div class="count-summary" id="countSummary">感染 0｜疑似 0｜正常 0</div></div>
      <div class="plate-scroll"><div class="plate" id="plate"></div></div>
      <div class="legend"><span style="--legend:var(--infected)">本日確認感染</span><span style="--legend:var(--suspected)">本日疑似</span><span style="--legend:var(--clear)">本日確認正常</span><span style="--legend:var(--masked)">較早已開始 mask</span></div>
      <div class="well-inspector" id="wellInspector" hidden>
        <div><h3 id="selectedWellTitle">Well</h3><div class="well-photo" id="wellPhoto"><img id="wellPhotoPreview" alt="所選 well 照片" /><div class="photo-prompt"><b>＋</b>拍照或選擇這個 well 的照片</div></div><input id="wellPhotoInput" type="file" accept="image/*" capture="environment" hidden /><div class="photo-buttons"><button id="chooseWellPhoto" type="button">拍照／選擇</button><button class="remove" id="removeWellPhoto" type="button">移除照片</button></div></div>
        <label class="well-meta">這個 well 的備註<textarea id="wellNote" placeholder="菌絲位置、感染程度、影像編號、需複查原因…"></textarea></label>
      </div>
      <div class="notes"><label>本次觀察備註<textarea id="observationNote" placeholder="拍攝位置、污染型態、需複查的 well…"></textarea></label><button class="btn" id="saveObservation" type="button">儲存本次觀察</button></div>
    </section>

    <section class="panel">
      <div class="plate-head"><h2>紀錄與匯出</h2><div class="actions"><button class="btn secondary" id="exportMask" type="button">匯出 Mask CSV</button><button class="btn secondary" id="exportLong" type="button">匯出完整紀錄 CSV</button><button class="btn secondary" id="backupJson" type="button">下載完整備份 JSON</button><button class="btn secondary" id="restoreJson" type="button">匯入完整備份</button><button class="btn secondary" id="readableBackup" type="button">下載可閱讀備份 ZIP</button><button class="btn danger" id="clearAll" type="button">清除全部</button><input id="restoreFile" type="file" accept="application/json,.json" hidden /></div></div>
      <div class="table-wrap"><table class="history"><thead><tr><th>Plate</th><th>Date</th><th>Day</th><th>感染</th><th>疑似</th><th>正常</th><th>照片</th><th>備註</th><th></th></tr></thead><tbody id="historyBody"></tbody></table></div>
    </section>
    <footer>只有「確認感染」會進入 Mask CSV；「疑似感染」只保留在完整觀察紀錄，待確認後再決定是否 mask。「完整備份 JSON」用於還原 App；「可閱讀備份 ZIP」可在電腦直接查看 CSV 與 JPG。</footer>
  </div>

  <script>
    const STORAGE_KEY='well-mask-recorder-v1';
    const PHOTO_DB='well-mask-recorder-photos';
    const PHOTO_STORE='photos';
    const rows='ABCDEFGH'.split('');
    const wells=rows.flatMap(row=>Array.from({length:12},(_,i)=>`${row}${i+1}`));
    const state=loadState();
    let brush='infected';
    let draft={};
    let draftPhotos={};
    let draftWellNotes={};
    let selectedWell='';
    let previewUrl='';
    const $=selector=>document.querySelector(selector);

    function today(){const d=new Date();d.setMinutes(d.getMinutes()-d.getTimezoneOffset());return d.toISOString().slice(0,10)}
    function loadState(){try{return{plates:{},observations:{},hiddenPlates:[],...JSON.parse(localStorage.getItem(STORAGE_KEY)||'{}')}}catch{return{plates:{},observations:{},hiddenPlates:[]}}}
    function saveState(){localStorage.setItem(STORAGE_KEY,JSON.stringify(state));$('#saveStatus').textContent='已儲存 '+new Date().toLocaleTimeString('zh-TW',{hour:'2-digit',minute:'2-digit'})}
    function key(plateId,date){return`${plateId}||${date}`}
    function dayNumber(start,date){if(!start||!date)return'';const ms=new Date(date+'T00:00:00')-new Date(start+'T00:00:00');return Number.isFinite(ms)?Math.round(ms/86400000):''}
    function dayLabel(start,date){const n=dayNumber(start,date);return n===''?'—':`D${n}`}
    function safeId(value){return value.trim().replace(/\s+/g,' ')}

    function photoKey(plateId,date,well){return`${plateId}||${date}||${well}`}
    function openPhotoDb(){return new Promise((resolve,reject)=>{const request=indexedDB.open(PHOTO_DB,1);request.onupgradeneeded=()=>request.result.createObjectStore(PHOTO_STORE);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)})}
    async function savePhoto(id,blob){const db=await openPhotoDb();await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).put(blob,id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
    async function getPhoto(id){const db=await openPhotoDb();const blob=await new Promise((resolve,reject)=>{const request=db.transaction(PHOTO_STORE).objectStore(PHOTO_STORE).get(id);request.onsuccess=()=>resolve(request.result);request.onerror=()=>reject(request.error)});db.close();return blob}
    async function deletePhoto(id){const db=await openPhotoDb();await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite');tx.objectStore(PHOTO_STORE).delete(id);tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close()}
    async function replaceAllPhotos(photoMap){const db=await openPhotoDb();await new Promise((resolve,reject)=>{const tx=db.transaction(PHOTO_STORE,'readwrite'),store=tx.objectStore(PHOTO_STORE);store.clear();photoMap.forEach(({id,blob})=>store.put(blob,id));tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error);tx.onabort=()=>reject(tx.error)});db.close()}
    function compressImage(file){return new Promise((resolve,reject)=>{const img=new Image(),url=URL.createObjectURL(file);img.onload=()=>{const max=1600,scale=Math.min(1,max/Math.max(img.width,img.height)),canvas=document.createElement('canvas');canvas.width=Math.round(img.width*scale);canvas.height=Math.round(img.height*scale);canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);canvas.toBlob(blob=>{URL.revokeObjectURL(url);blob?resolve(blob):reject(new Error('photo'))},'image/jpeg',.82)};img.onerror=reject;img.src=url})}
    function blobToDataUrl(blob){return new Promise((resolve,reject)=>{const reader=new FileReader();reader.onload=()=>resolve(reader.result);reader.onerror=reject;reader.readAsDataURL(blob)})}
    function dataUrlToBlob(dataUrl){if(typeof dataUrl!=='string'||!dataUrl.startsWith('data:'))throw new Error('invalid photo');const[header,payload]=dataUrl.split(',',2),type=header.match(/^data:([^;,]+)/)?.[1]||'image/jpeg',binary=header.includes(';base64')?atob(payload):decodeURIComponent(payload),bytes=new Uint8Array(binary.length);for(let i=0;i<binary.length;i++)bytes[i]=binary.charCodeAt(i);return new Blob([bytes],{type})}
    function safeFilePart(value){return String(value||'unnamed').normalize('NFKC').replace(/[\\/:*?"<>|\u0000-\u001f]+/g,'_').replace(/\s+/g,'_').replace(/^_+|_+$/g,'').slice(0,80)||'unnamed'}
    const crcTable=(()=>{const table=new Uint32Array(256);for(let n=0;n<256;n++){let c=n;for(let k=0;k<8;k++)c=c&1?0xedb88320^(c>>>1):c>>>1;table[n]=c>>>0}return table})();
    function crc32(bytes){let crc=0xffffffff;for(const byte of bytes)crc=crcTable[(crc^byte)&0xff]^(crc>>>8);return(crc^0xffffffff)>>>0}
    function zipDateTime(date=new Date()){const year=Math.max(1980,date.getFullYear());return{time:(date.getHours()<<11)|(date.getMinutes()<<5)|Math.floor(date.getSeconds()/2),date:((year-1980)<<9)|((date.getMonth()+1)<<5)|date.getDate()}}
    function concatBytes(parts){const output=new Uint8Array(parts.reduce((sum,part)=>sum+part.length,0));let offset=0;parts.forEach(part=>{output.set(part,offset);offset+=part.length});return output}
    function createZip(files){const encoder=new TextEncoder(),localParts=[],centralParts=[],{time,date}=zipDateTime();let offset=0;files.forEach(file=>{const name=encoder.encode(file.name.replaceAll('\\','/')),data=file.data instanceof Uint8Array?file.data:new Uint8Array(file.data),crc=crc32(data),local=new Uint8Array(30+name.length),lv=new DataView(local.buffer);lv.setUint32(0,0x04034b50,true);lv.setUint16(4,20,true);lv.setUint16(6,0x0800,true);lv.setUint16(8,0,true);lv.setUint16(10,time,true);lv.setUint16(12,date,true);lv.setUint32(14,crc,true);lv.setUint32(18,data.length,true);lv.setUint32(22,data.length,true);lv.setUint16(26,name.length,true);lv.setUint16(28,0,true);local.set(name,30);localParts.push(local,data);const central=new Uint8Array(46+name.length),cv=new DataView(central.buffer);cv.setUint32(0,0x02014b50,true);cv.setUint16(4,20,true);cv.setUint16(6,20,true);cv.setUint16(8,0x0800,true);cv.setUint16(10,0,true);cv.setUint16(12,time,true);cv.setUint16(14,date,true);cv.setUint32(16,crc,true);cv.setUint32(20,data.length,true);cv.setUint32(24,data.length,true);cv.setUint16(28,name.length,true);cv.setUint16(30,0,true);cv.setUint16(32,0,true);cv.setUint16(34,0,true);cv.setUint16(36,0,true);cv.setUint32(38,0,true);cv.setUint32(42,offset,true);central.set(name,46);centralParts.push(central);offset+=local.length+data.length});const central=concatBytes(centralParts),end=new Uint8Array(22),ev=new DataView(end.buffer);ev.setUint32(0,0x06054b50,true);ev.setUint16(4,0,true);ev.setUint16(6,0,true);ev.setUint16(8,files.length,true);ev.setUint16(10,files.length,true);ev.setUint32(12,central.length,true);ev.setUint32(16,offset,true);ev.setUint16(20,0,true);return new Blob([...localParts,central,end],{type:'application/zip'})}

    function buildPlate(){const plate=$('#plate');plate.innerHTML='<div></div>'+Array.from({length:12},(_,i)=>`<div class="col-label">${i+1}</div>`).join('');rows.forEach(row=>{plate.insertAdjacentHTML('beforeend',`<div class="row-label">${row}</div>`);for(let col=1;col<=12;col++){const well=`${row}${col}`;const button=document.createElement('button');button.type='button';button.className='well';button.dataset.well=well;button.textContent=well;button.setAttribute('aria-label',well);button.addEventListener('click',()=>{draft[well]=brush;selectedWell=well;renderPlate();renderWellInspector()});plate.appendChild(button)}})}

    function currentPlate(){return safeId($('#plateId').value)}
    function currentDate(){return $('#observationDate').value}
    function earliestMasks(plateId){const result={};Object.values(state.observations).filter(o=>o.plateId===plateId).sort((a,b)=>a.date.localeCompare(b.date)).forEach(o=>Object.entries(o.statuses).forEach(([well,status])=>{if(status==='infected'&&!result[well])result[well]=o.date}));return result}

    function renderPlate(){const plateId=currentPlate();const date=currentDate();const masks=earliestMasks(plateId);const counts={infected:0,suspected:0,clear:0};document.querySelectorAll('.well').forEach(button=>{const status=draft[button.dataset.well]||'none';button.className='well';if(status!=='none'){button.classList.add(status);counts[status]++}if(masks[button.dataset.well]&&masks[button.dataset.well]<date)button.classList.add('prior-masked');button.title=masks[button.dataset.well]?`首次感染：${masks[button.dataset.well]}`:button.dataset.well});$('#countSummary').textContent=`感染 ${counts.infected}｜疑似 ${counts.suspected}｜正常 ${counts.clear}`;$('#plateTitle').textContent=plateId?`${plateId} · ${date||'未選日期'}`:'96-well plate'}

    function loadRecord(){const plateId=currentPlate(),date=currentDate();if(!plateId||!date)return alert('請先輸入 Plate ID 與觀察日期。');const record=state.observations[key(plateId,date)];draft={...(record?.statuses||{})};draftPhotos=Object.fromEntries((record?.photos||[]).map(well=>[well,true]));draftWellNotes={...(record?.wellNotes||{})};selectedWell='';$('#observationNote').value=record?.note||'';const plate=state.plates[plateId];if(plate?.startDate)$('#startDate').value=plate.startDate;updateDay();renderPlate();renderWellInspector()}
    function updateDay(){$('#dayDisplay').textContent=dayLabel($('#startDate').value,currentDate());renderPlate()}

    function saveObservation(){const plateId=currentPlate(),date=currentDate(),startDate=$('#startDate').value;if(!plateId||!date)return alert('請先輸入 Plate ID 與觀察日期。');state.plates[plateId]={startDate};state.hiddenPlates=(state.hiddenPlates||[]).filter(id=>id!==plateId);const statuses=Object.fromEntries(Object.entries(draft).filter(([,status])=>status!=='none'));const photos=Object.keys(draftPhotos).filter(well=>draftPhotos[well]);const wellNotes=Object.fromEntries(Object.entries(draftWellNotes).filter(([,note])=>note.trim()));state.observations[key(plateId,date)]={plateId,date,startDate,statuses,photos,wellNotes,note:$('#observationNote').value.trim(),updatedAt:new Date().toISOString()};saveState();renderAll();alert('本次觀察已儲存。')}

    async function renderWellInspector(){const panel=$('#wellInspector');if(!selectedWell){panel.hidden=true;return}const plateId=currentPlate(),date=currentDate();if(!plateId||!date){panel.hidden=true;return}panel.hidden=false;$('#selectedWellTitle').textContent=`${plateId} · ${date} · ${selectedWell}`;$('#wellNote').value=draftWellNotes[selectedWell]||'';const photoBox=$('#wellPhoto'),image=$('#wellPhotoPreview');photoBox.classList.remove('has-photo');if(previewUrl){URL.revokeObjectURL(previewUrl);previewUrl=''}if(draftPhotos[selectedWell]){const blob=await getPhoto(photoKey(plateId,date,selectedWell));if(blob){previewUrl=URL.createObjectURL(blob);image.src=previewUrl;photoBox.classList.add('has-photo')}else{draftPhotos[selectedWell]=false}}}

    async function removeRecord(record){for(const well of record.photos||[])await deletePhoto(photoKey(record.plateId,record.date,well));delete state.observations[key(record.plateId,record.date)]}
    function renderPlateOptions(){const selected=currentPlate();const ids=Object.keys(state.plates).filter(id=>!(state.hiddenPlates||[]).includes(id)).sort();$('#plateSelect').innerHTML='<option value="">選擇盤子…</option>'+ids.map(id=>`<option value="${escapeHtml(id)}">${escapeHtml(id)}</option>`).join('');if(ids.includes(selected))$('#plateSelect').value=selected}
    function renderHistory(){const body=$('#historyBody');const records=Object.values(state.observations).sort((a,b)=>b.date.localeCompare(a.date)||a.plateId.localeCompare(b.plateId));body.innerHTML=records.length?'':`<tr><td colspan="9" class="empty">尚無觀察紀錄</td></tr>`;records.forEach(record=>{const count=status=>Object.values(record.statuses).filter(x=>x===status).length;const tr=document.createElement('tr');tr.innerHTML=`<td>${escapeHtml(record.plateId)}</td><td>${record.date}</td><td>${dayLabel(record.startDate,record.date)}</td><td>${count('infected')}</td><td>${count('suspected')}</td><td>${count('clear')}</td><td>${(record.photos||[]).length}</td><td>${escapeHtml(record.note||'')}</td><td><button type="button">刪除</button></td>`;tr.querySelector('button').addEventListener('click',async()=>{if(confirm('刪除這筆日期紀錄與其 well 照片？')){await removeRecord(record);saveState();renderAll()}});body.appendChild(tr)});renderPlateOptions()}
    function escapeHtml(text){return String(text).replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]))}
    function renderAll(){renderPlate();renderHistory();renderWellInspector()}

    function maskRows(){const output=[];Object.keys(state.plates).sort().forEach(plateId=>{const masks=earliestMasks(plateId);Object.entries(masks).sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true})).forEach(([well,date])=>{const record=state.observations[key(plateId,date)]||{};output.push({plateId,well,row:well[0],column:Number(well.slice(1)),date,startDate:state.plates[plateId]?.startDate||'',hasPhoto:(record.photos||[]).includes(well),wellNote:record.wellNotes?.[well]||''})})});return output}
    function csvCell(value){return`"${String(value??'').replaceAll('"','""')}"`}
    function downloadCsv(rows,filename){const text='\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n');downloadBlob(new Blob([text],{type:'text/csv;charset=utf-8'}),filename)}
    function downloadBlob(blob,filename){const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download=filename;a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)}

    function maskCsvRows(){const output=[['plate_id','well','row','column','d0_date','first_infected_date','mask_from_date','experiment_day','day_label','status','reason','has_photo','well_note']];maskRows().forEach(x=>output.push([x.plateId,x.well,x.row,x.column,x.startDate,x.date,x.date,dayNumber(x.startDate,x.date),dayLabel(x.startDate,x.date),'confirmed_mask','infection',x.hasPhoto?'yes':'no',x.wellNote]));return output}
    function longCsvRows(){const output=[['plate_id','d0_date','observation_date','experiment_day','day_label','well','row','column','status','has_photo','well_note','observation_note']];Object.values(state.observations).sort((a,b)=>a.date.localeCompare(b.date)||a.plateId.localeCompare(b.plateId)).forEach(o=>Object.entries(o.statuses).sort(([a],[b])=>a.localeCompare(b,undefined,{numeric:true})).forEach(([well,status])=>output.push([o.plateId,o.startDate,o.date,dayNumber(o.startDate,o.date),dayLabel(o.startDate,o.date),well,well[0],Number(well.slice(1)),status,(o.photos||[]).includes(well)?'yes':'no',o.wellNotes?.[well]||'',o.note||''])));return output}
    function csvBytes(rows){return new TextEncoder().encode('\ufeff'+rows.map(row=>row.map(csvCell).join(',')).join('\r\n'))}
    $('#exportMask').addEventListener('click',()=>downloadCsv(maskCsvRows(),`well_mask_${today()}.csv`));
    $('#exportLong').addEventListener('click',()=>downloadCsv(longCsvRows(),`well_observations_${today()}.csv`));
    $('#backupJson').addEventListener('click',async()=>{const photos={};for(const record of Object.values(state.observations)){for(const well of record.photos||[]){const id=photoKey(record.plateId,record.date,well),blob=await getPhoto(id);if(blob)photos[id]=await blobToDataUrl(blob)}}downloadBlob(new Blob([JSON.stringify({version:2,exportedAt:new Date().toISOString(),state,photos},null,2)],{type:'application/json'}),`well_mask_backup_${today()}.json`);$('#saveStatus').textContent='含照片備份已下載'});
    $('#restoreJson').addEventListener('click',()=>$('#restoreFile').click());
    $('#restoreFile').addEventListener('change',async event=>{const file=event.target.files?.[0];if(!file)return;try{const backup=JSON.parse(await file.text());if(!backup.state||typeof backup.state!=='object'||!backup.photos||typeof backup.photos!=='object')throw new Error('invalid backup');const photoMap=Object.entries(backup.photos).map(([id,dataUrl])=>({id,blob:dataUrlToBlob(dataUrl)}));if(!confirm(`匯入會取代目前所有 plate、日期、well 紀錄與照片。\n備份內含 ${photoMap.length} 張照片。確定繼續？`))return;$('#saveStatus').textContent='正在還原完整備份…';await replaceAllPhotos(photoMap);const restored={plates:{},observations:{},hiddenPlates:[],...backup.state};state.plates=restored.plates||{};state.observations=restored.observations||{};state.hiddenPlates=restored.hiddenPlates||[];draft={};draftPhotos={};draftWellNotes={};selectedWell='';const first=Object.values(state.observations).sort((a,b)=>b.date.localeCompare(a.date)||a.plateId.localeCompare(b.plateId))[0];if(first){$('#plateId').value=first.plateId;$('#observationDate').value=first.date;$('#startDate').value=first.startDate||''}else{$('#plateId').value='';$('#observationDate').value=today();$('#startDate').value=''}saveState();renderAll();if(first)loadRecord();$('#saveStatus').textContent=`備份已還原（${photoMap.length} 張照片）`}catch(error){console.error(error);alert('無法匯入此備份。請確認檔案是由 QC App 的「下載完整備份 JSON」產生。');$('#saveStatus').textContent='備份匯入失敗'}finally{event.target.value=''}});
    $('#readableBackup').addEventListener('click',async()=>{$('#saveStatus').textContent='正在製作可閱讀備份 ZIP…';try{const files=[{name:'well_mask.csv',data:csvBytes(maskCsvRows())},{name:'well_observations.csv',data:csvBytes(longCsvRows())}],photoIndex=[['plate_id','observation_date','well','status','photo_filename','well_note','observation_note']],usedNames=new Set();let photoCount=0;const records=Object.values(state.observations).sort((a,b)=>a.date.localeCompare(b.date)||a.plateId.localeCompare(b.plateId));for(const record of records){for(const well of [...(record.photos||[])].sort((a,b)=>a.localeCompare(b,undefined,{numeric:true}))){const id=photoKey(record.plateId,record.date,well),blob=await getPhoto(id);if(!blob)continue;const base=`${safeFilePart(record.plateId)}_${record.date}_${well}`;let name=`photos/${base}.jpg`,suffix=2;while(usedNames.has(name.toLowerCase()))name=`photos/${base}_${suffix++}.jpg`;usedNames.add(name.toLowerCase());files.push({name,data:new Uint8Array(await blob.arrayBuffer())});photoIndex.push([record.plateId,record.date,well,record.statuses?.[well]||'none',name,record.wellNotes?.[well]||'',record.note||'']);photoCount++}}files.push({name:'photo_index.csv',data:csvBytes(photoIndex)});files.push({name:'README.txt',data:new TextEncoder().encode('96-Well QC readable backup\r\n\r\nwell_mask.csv：確認感染 wells 的 mask 起始日期。\r\nwell_observations.csv：所有已標記 well 的完整觀察紀錄。\r\nphoto_index.csv：所有照片與 Plate、日期、well 的對照表。\r\nphotos/：可直接用 Windows 相片開啟的 JPG。\r\n\r\n照片檔名格式：PlateID_日期_Well.jpg\r\n')});downloadBlob(createZip(files),`well_mask_readable_backup_${today()}.zip`);$('#saveStatus').textContent=`可閱讀備份已下載（${photoCount} 張照片）`}catch(error){console.error(error);$('#saveStatus').textContent='可閱讀備份製作失敗';alert('無法製作 ZIP，請再試一次或先下載完整備份 JSON。')}});
    $('#clearAll').addEventListener('click',async()=>{if(confirm('確定清除所有 plate、日期、well 紀錄與照片？此動作無法復原。')){for(const record of Object.values(state.observations))await removeRecord(record);state.plates={};state.observations={};state.hiddenPlates=[];draft={};draftPhotos={};draftWellNotes={};selectedWell='';saveState();renderAll()}});
    $('#saveObservation').addEventListener('click',saveObservation);$('#loadRecord').addEventListener('click',loadRecord);$('#clearDraft').addEventListener('click',()=>{if(confirm('清除目前畫面上的本日標記與備註？照片不會自動刪除，請在各 well 按「移除照片」。')){draft={};draftWellNotes={};selectedWell='';$('#observationNote').value='';renderAll()}});
    $('#plateSelect').addEventListener('change',()=>{if(!$('#plateSelect').value)return;$('#plateId').value=$('#plateSelect').value;loadRecord()});
    $('#hidePlate').addEventListener('click',()=>{const plateId=currentPlate();if(!plateId)return alert('請先選擇或輸入 Plate ID。');if(!state.plates[plateId])return alert('此盤子尚未儲存，尚未加入下拉選單。');if(!confirm(`從下拉選單隱藏 ${plateId}？既有紀錄、照片與 CSV 匯出資料都會保留。`))return;state.hiddenPlates=[...new Set([...(state.hiddenPlates||[]),plateId])];saveState();renderPlateOptions();$('#plateSelect').value=''});
    $('#restoreHidden').addEventListener('click',()=>{const hidden=state.hiddenPlates||[];if(!hidden.length)return alert('目前沒有隱藏的盤子。');if(!confirm(`重新顯示以下盤子？\n${hidden.join('\n')}`))return;state.hiddenPlates=[];saveState();renderPlateOptions()});
    $('#deletePlate').addEventListener('click',async()=>{const plateId=currentPlate();if(!plateId)return alert('請先選擇或輸入 Plate ID。');const records=Object.values(state.observations).filter(record=>record.plateId===plateId);if(!confirm(`永久刪除 ${plateId} 的 ${records.length} 筆日期紀錄與所有 well 照片？此動作無法復原。`))return;for(const record of records)await removeRecord(record);delete state.plates[plateId];state.hiddenPlates=(state.hiddenPlates||[]).filter(id=>id!==plateId);draft={};draftPhotos={};draftWellNotes={};selectedWell='';$('#plateId').value='';$('#observationNote').value='';saveState();renderAll()});
    $('#chooseWellPhoto').addEventListener('click',()=>$('#wellPhotoInput').click());
    $('#wellPhotoInput').addEventListener('change',async()=>{const file=$('#wellPhotoInput').files?.[0],plateId=currentPlate(),date=currentDate();if(!file||!selectedWell||!plateId||!date)return;$('#saveStatus').textContent='正在處理照片…';try{const blob=await compressImage(file);await savePhoto(photoKey(plateId,date,selectedWell),blob);draftPhotos[selectedWell]=true;await renderWellInspector();$('#saveStatus').textContent='照片已加入；請按儲存本次觀察'}catch{$('#saveStatus').textContent='照片儲存失敗，請再試一次'}finally{$('#wellPhotoInput').value=''}});
    $('#removeWellPhoto').addEventListener('click',async()=>{const plateId=currentPlate(),date=currentDate();if(!selectedWell||!draftPhotos[selectedWell])return;if(!confirm(`移除 ${selectedWell} 在 ${date} 的照片？`))return;await deletePhoto(photoKey(plateId,date,selectedWell));draftPhotos[selectedWell]=false;await renderWellInspector()});
    $('#wellNote').addEventListener('input',event=>{if(selectedWell)draftWellNotes[selectedWell]=event.target.value});
    document.querySelectorAll('.brush').forEach(button=>button.addEventListener('click',()=>{brush=button.dataset.status;document.querySelectorAll('.brush').forEach(x=>x.classList.toggle('active',x===button))}));
    $('#plateId').addEventListener('change',()=>{selectedWell='';loadRecord()});$('#observationDate').addEventListener('change',()=>{selectedWell='';updateDay();loadRecord()});$('#startDate').addEventListener('change',updateDay);

    buildPlate();$('#observationDate').value=today();updateDay();renderAll();
  </script>
</body>
</html>
